<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Notas - Psicología Social</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-split-container">

        <section class="left-panel">
            <header class="header">
                <h1>Psicología Social</h1>
                <button id="btn-borrar" class="icon-btn" title="Borrar datos" aria-label="Borrar todas las notas">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </header>

            <div class="final-result-box">
                <span class="label">Promedio Final</span>
                <div class="final-score" id="promedio-final">--</div>
                <div class="status" id="estado">Ingresa tus notas</div>
            </div>

            <div class="units-vertical-list">
                <button class="unit-row unit-selector active" data-target="unidad1-panel" type="button">
                    <div class="unit-info">
                        <span>Unidad I</span>
                        <small>30% del curso</small>
                    </div>
                    <strong id="unidad1-total">--</strong>
                </button>

                <button class="unit-row unit-selector" data-target="unidad2-panel" type="button">
                    <div class="unit-info">
                        <span>Unidad II</span>
                        <small>35% del curso</small>
                    </div>
                    <strong id="unidad2-total">--</strong>
                </button>

                <button class="unit-row unit-selector" data-target="unidad3-panel" type="button">
                    <div class="unit-info">
                        <span>Unidad III</span>
                        <small>35% del curso</small>
                    </div>
                    <strong id="unidad3-total">--</strong>
                </button>
            </div>

            <div class="meta-box" id="meta-container">
                Completa las evaluaciones de las tres unidades para calcular tu promedio final.
            </div>
        </section>

        <section class="right-panel">
            <div class="unit-panel active" id="unidad1-panel">
                <div class="section-title">
                    <span>Unidad I</span>
                    <small>7 evaluaciones · peso de la unidad: 30%</small>
                </div>

                <div class="inputs-list">
                    <div class="input-row">
                        <label for="u1-e1">Evaluación 01 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u1-e1" data-unit="1" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u1-e2">Evaluación 02 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u1-e2" data-unit="1" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u1-e3">Evaluación 03 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u1-e3" data-unit="1" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u1-e4">Evaluación 04 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u1-e4" data-unit="1" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u1-e5">Evaluación 05 <span>20%</span></label>
                        <input type="number" class="grade-input" id="u1-e5" data-unit="1" data-weight="0.20" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u1-e6">Evaluación 06 <span>30%</span></label>
                        <input type="number" class="grade-input" id="u1-e6" data-unit="1" data-weight="0.30" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u1-e7">Evaluación 07 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u1-e7" data-unit="1" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                </div>
            </div>

            <div class="unit-panel" id="unidad2-panel">
                <div class="section-title">
                    <span>Unidad II</span>
                    <small>7 evaluaciones · peso de la unidad: 35%</small>
                </div>

                <div class="inputs-list">
                    <div class="input-row">
                        <label for="u2-e1">Evaluación 01 <span>5%</span></label>
                        <input type="number" class="grade-input" id="u2-e1" data-unit="2" data-weight="0.05" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u2-e2">Evaluación 02 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u2-e2" data-unit="2" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u2-e3">Evaluación 03 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u2-e3" data-unit="2" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u2-e4">Evaluación 04 <span>15%</span></label>
                        <input type="number" class="grade-input" id="u2-e4" data-unit="2" data-weight="0.15" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u2-e5">Evaluación 05 <span>20%</span></label>
                        <input type="number" class="grade-input" id="u2-e5" data-unit="2" data-weight="0.20" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u2-e6">Evaluación 06 <span>30%</span></label>
                        <input type="number" class="grade-input" id="u2-e6" data-unit="2" data-weight="0.30" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u2-e7">Evaluación 07 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u2-e7" data-unit="2" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                </div>
            </div>

            <div class="unit-panel" id="unidad3-panel">
                <div class="section-title">
                    <span>Unidad III</span>
                    <small>8 evaluaciones · peso de la unidad: 35%</small>
                </div>

                <div class="inputs-list">
                    <div class="input-row">
                        <label for="u3-e1">Evaluación 01 <span>5%</span></label>
                        <input type="number" class="grade-input" id="u3-e1" data-unit="3" data-weight="0.05" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u3-e2">Evaluación 02 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u3-e2" data-unit="3" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u3-e3">Evaluación 03 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u3-e3" data-unit="3" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u3-e4">Evaluación 04 <span>15%</span></label>
                        <input type="number" class="grade-input" id="u3-e4" data-unit="3" data-weight="0.15" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u3-e5">Evaluación 05 <span>15%</span></label>
                        <input type="number" class="grade-input" id="u3-e5" data-unit="3" data-weight="0.15" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u3-e6">Evaluación 06 <span>25%</span></label>
                        <input type="number" class="grade-input" id="u3-e6" data-unit="3" data-weight="0.25" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u3-e7">Evaluación 07 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u3-e7" data-unit="3" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                    <div class="input-row">
                        <label for="u3-e8">Evaluación 08 <span>10%</span></label>
                        <input type="number" class="grade-input" id="u3-e8" data-unit="3" data-weight="0.10" min="0" max="20" step="0.01" placeholder="--" inputmode="decimal">
                    </div>
                </div>
            </div>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
